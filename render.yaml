# Optional Render blueprint for the API. The frontend is deployed separately (Vercel/Netlify).
services:
  - type: web
    name: bidbazaar-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: AUCTION_APP
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: COOKIE_EXPIRE
        value: "7"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SERVICE
        value: gmail
      - key: SMTP_MAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
